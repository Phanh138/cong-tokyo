.num{font-family:var(--serif);font-weight:700;font-variant-numeric:lining-nums}

.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:10px 12px 9px 18px;background:var(--paper) var(--grain);border-bottom:1px solid transparent}
.top.scrolled{border-bottom-color:var(--ink)}
.brand{display:flex;align-items:center;gap:9px;border:0;background:transparent;padding:0}
.brand b{font-family:var(--serif);font-weight:600;font-size:29px;line-height:1;letter-spacing:.13em;padding-top:4px}
.hanko{display:grid;place-items:center;background:var(--son);color:var(--diep);font-family:var(--mincho);font-weight:800;line-height:1}
.brand .hanko{width:19px;height:33px;border-radius:2px;writing-mode:vertical-rl;font-size:11px;letter-spacing:.14em}
.top-actions{display:flex;align-items:center;gap:4px}
.lang{display:flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.lang button{border:0;background:transparent;height:34px;min-width:46px;padding:0 10px;font-size:12px;color:var(--ink)}
.lang button.on{background:var(--ink);color:var(--diep);font-weight:600}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;position:relative}
.badge[hidden]{display:none}
.badge{position:absolute;top:4px;right:3px;min-width:18px;height:18px;border-radius:9px;background:var(--son);color:var(--diep);font-size:10px;font-weight:600;display:grid;place-items:center;padding:0 4px}

/* noren: the shop curtain, in Cộng's olive */
.noren{position:relative;z-index:3;padding:0 16px}
.noren .rod{display:block;height:7px;margin:0 -8px;border-radius:4px;background:var(--ink)}
.noren .cloth{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.noren .cloth span{height:104px;background:var(--olive);border-top:3px solid var(--olive-d);color:var(--diep);display:grid;place-items:center;font-family:var(--mincho);font-weight:800;font-size:clamp(40px,13.5vw,58px);line-height:1;transform-origin:50% 0}
.enter .noren .cloth span{animation:sway 2.2s cubic-bezier(.3,.6,.3,1) both}
.enter .noren .cloth span:nth-child(2){animation-delay:.08s}
.enter .noren .cloth span:nth-child(3){animation-delay:.16s}
.enter .noren .cloth span:nth-child(4){animation-delay:.24s}
@keyframes sway{0%{transform:skewX(0) scaleY(.96)}22%{transform:skewX(-4deg)}48%{transform:skewX(2.4deg)}72%{transform:skewX(-1deg)}100%{transform:none}}

/* hero */
.hero{padding-top:8px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 106px;margin:-48px 16px 0}
.stage .ph{height:400px;overflow:hidden;background:#3a3327}
.stage .ph img{width:100%;height:107%;object-fit:cover;object-position:60% 0}
.stage .col{display:flex;flex-direction:column;align-items:center;gap:16px;padding:70px 0 0 12px}
.stage h1{margin:0;font-weight:600;font-size:27px;line-height:1.5;letter-spacing:.1em;white-space:nowrap}
.stage .hanko{width:34px;height:34px;border-radius:50%;font-size:21px;transform:rotate(-6deg);padding-bottom:2px}
.hero-vi{margin:20px 18px 0;font-family:var(--serif);font-style:italic;font-weight:500;font-size:27px;line-height:1.15}
.hero .cta{padding:18px 16px 0}

/* buttons */
.cta-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:100%;min-height:58px;padding:8px 18px;border:0;border-radius:2px;background:var(--olive);color:var(--diep);text-align:center}
.cta-btn b{font-size:15px;font-weight:500;letter-spacing:.12em}
.cta-btn small{font-size:11px;color:#D5D0BC}
.cta-btn.light{background:var(--slip);color:var(--ink);border:1px solid var(--ink)}
.cta-btn.light small{color:var(--sub)}
.cta-btn:disabled{opacity:.4;cursor:not-allowed}

/* sections */
.sec{padding:36px 18px 0}
.h2{margin:0;font-family:var(--serif);font-weight:600;font-size:25px;line-height:1.25;letter-spacing:.06em}
html[lang=vi] .h2{font-size:30px;letter-spacing:0}
.h2-sub{margin:4px 0 0;font-size:12px;color:var(--sub)}
.sec-rule{display:flex;align-items:center;gap:12px}
.sec-rule::after{content:"";flex:1;height:1px;background:var(--ink)}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:30px 18px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.values div{padding:15px 4px;text-align:center;border-right:1px solid var(--line)}
.values div:last-child{border-right:0}
.values b{display:block;font-family:var(--mincho);font-weight:600;font-size:14px;letter-spacing:.06em}
.values small{display:block;margin-top:3px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:14px;color:var(--sub)}

/* featured rail, with a hanging menu slip (tanzaku) on each photo */
.rail{display:flex;gap:14px;overflow-x:auto;padding:18px 18px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{flex:0 0 64%;scroll-snap-align:start;border:0;background:transparent;padding:0;text-align:left}
.photo{position:relative;display:block;overflow:hidden;background:var(--line)}
.photo img{width:100%;height:100%;object-fit:cover}
.rcard .photo{aspect-ratio:4/5}
.slip{position:absolute;top:0;right:12px;writing-mode:vertical-rl;background:var(--slip);color:var(--ink);font-family:var(--mincho);font-weight:600;font-size:12.5px;letter-spacing:.18em;padding:12px 5px 9px;white-space:nowrap}
.rcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:10px}
.rcard .n{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;line-height:1.15}
.rcard .p{font-size:20px}

/* ticket (vote invitation) */
.ticket{position:relative;display:flex;margin:36px 18px 0;background:var(--slip);border:1px solid var(--ink)}
.ticket .tk-body{flex:1;min-width:0;padding:20px 16px 18px;display:flex;flex-direction:column;gap:6px}
.ticket h3{text-wrap:balance;margin:0;font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.35;letter-spacing:.04em}
html[lang=vi] .ticket h3{font-size:25px;line-height:1.15;letter-spacing:0}
.ticket p{margin:0 0 10px;font-size:12px;color:var(--sub)}
.ticket .tk-stub{width:54px;border-left:1px dashed var(--ink);display:grid;place-items:center}
.ticket .tk-stub span{font-weight:600;font-size:15px;letter-spacing:.5em;padding-top:.5em}
.ticket::before,.ticket::after{content:"";position:absolute;right:46px;width:16px;height:16px;border-radius:50%;background:var(--paper);border:1px solid var(--ink)}
.ticket::before{top:-9px;clip-path:inset(50% 0 0 0)}
.ticket::after{bottom:-9px;clip-path:inset(0 0 50% 0)}

/* story */
.story{margin:18px 18px 0}
.story .photo{height:190px}
.story p{margin:14px 0 0}
.story .p-ja{font-family:var(--mincho);font-weight:500;font-size:15px;line-height:1.95;letter-spacing:.04em}
.story .p-vi{font-variant-numeric:lining-nums;font-family:var(--serif);font-style:italic;font-weight:500;font-size:18px;line-height:1.4;color:var(--sub)}

/* footer */
.tiles{height:36px;background:var(--tiles) 0 0/36px 36px;margin-top:40px}
.foot{padding:22px 22px 18px;text-align:center;font-size:10px;line-height:1.75;color:var(--muted)}
.foot .brand{display:inline-flex;margin-bottom:12px;color:var(--ink)}

/* page title */
.ptitle{padding:26px 20px 20px}
.ptitle h1{text-wrap:balance;margin:0;font-family:var(--serif);font-weight:600;font-size:32px;line-height:1.2;letter-spacing:.14em}
html[lang=vi] .ptitle h1{font-size:38px;letter-spacing:.01em}
.ptitle h1.long{font-size:24px;letter-spacing:.06em;line-height:1.4}
html[lang=vi] .ptitle h1.long{font-size:30px;letter-spacing:0;line-height:1.15}
.ptitle p{margin:5px 0 0;font-size:13px;color:var(--sub)}
.back{display:flex;align-items:center;gap:7px;height:44px;padding:0 16px;border:0;background:transparent;font-size:13px;color:var(--sub)}

/* category list */
.cats{margin:0 18px;border-top:1px solid var(--ink)}
.cat{display:flex;align-items:center;gap:16px;width:100%;padding:19px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.cat:last-child{border-bottom-color:var(--ink)}
.cat .t{flex:1;display:flex;flex-direction:column;gap:2px}
.cat .t b{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.06em}
html[lang=vi] .cat .t b{font-size:22px;letter-spacing:0}
.cat .t small{font-size:12px;color:var(--sub)}
.cat .cnt{font-size:17px;color:var(--sub)}

/* product list */
.plist{margin:0 18px;border-top:1px solid var(--ink)}
.prow{display:flex;align-items:center;gap:14px;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left}
.prow:last-child{border-bottom-color:var(--ink)}
.prow img{width:86px;height:86px;object-fit:cover;flex-shrink:0;background:var(--line)}
.prow .t{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.prow .n{text-wrap:balance;font-family:var(--serif);font-weight:600;font-size:15.5px;line-height:1.3;letter-spacing:.03em}
html[lang=vi] .prow .n{font-size:20px;letter-spacing:0;line-height:1.15}
.prow .s{font-size:11px;color:var(--sub)}
.prow .p{font-size:19px;flex-shrink:0}
.tag{align-self:flex-start;display:inline-block;font-family:var(--mincho);font-weight:600;font-size:10.5px;letter-spacing:.12em;color:var(--diep);background:var(--son);padding:2px 6px 3px;border-radius:2px}
.chev{flex-shrink:0}

/* detail */
.dimg{margin:0 18px;aspect-ratio:1}
.dbody{padding:20px 20px 10px}
.dbody h1{margin:0;font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.3;letter-spacing:.04em}
html[lang=vi] .dbody h1{font-size:33px;line-height:1.1;letter-spacing:0}
.dbody .s{margin-top:4px;font-size:13px;color:var(--sub)}
.dbody .price{font-size:30px;margin:12px 0 0;line-height:1}
.dbody .tax{margin-top:4px;font-size:10px;color:var(--muted)}
.dbody .desc{font-size:13.5px;line-height:1.9;color:var(--sub);margin:16px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.label{margin:24px 0 10px;display:flex;align-items:baseline;gap:8px}
.label b{font-size:14px;font-weight:500}
.label small{font-size:11px;color:var(--muted)}
.sweet{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.sweet button{min-height:58px;border:0;border-right:1px solid var(--line);background:var(--slip);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 2px}
.sweet button:last-child{border-right:0}
.sweet button b{font-size:18px;line-height:1.1}
.sweet button small{font-size:10px;color:var(--sub)}
.sweet button.on{background:var(--olive);color:var(--diep)}
.sweet button.on small{color:#D5D0BC}
.buy{display:flex;gap:10px;margin-top:24px}
.stepper{display:flex;align-items:center;border:1px solid var(--ink);border-radius:2px;background:var(--slip)}
.stepper button{width:44px;height:56px;border:0;background:transparent;font-size:18px}
.stepper span{min-width:26px;text-align:center;font-size:19px}
.buy .cta-btn{flex:1}
.note{font-size:10px;color:var(--muted);line-height:1.6;margin:14px 0 0}

/* cart */
.clist{margin:0 18px;border-top:1px solid var(--ink)}
.citem{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.citem img{width:76px;height:76px;object-fit:cover}
.citem .t{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.citem .t>b{font-family:var(--serif);font-weight:600;font-size:16px;letter-spacing:.03em}
html[lang=vi] .citem .t>b{font-size:19px;letter-spacing:0}
.citem .t>small{font-size:11px;color:var(--sub)}
.citem .row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.citem .row .num{font-size:19px}
.citem .stepper button{width:38px;height:38px}
.rm{border:0;background:transparent;font-size:11px;color:var(--son);text-decoration:underline;padding:6px 0;align-self:flex-start;min-height:30px}
.summary{margin:0 18px;padding:14px 0 6px;border-bottom:1px solid var(--ink)}
.summary .r{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;padding:4px 0;color:var(--sub)}
.summary .r.total{color:var(--ink);font-size:15px;padding-top:8px}
.summary .r.total .num{font-size:28px}
.empty{text-align:center;padding:34px 30px 30px;color:var(--sub);font-size:13px;line-height:1.9}

/* vote */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px;padding:0 18px}
.vopt{border:0;background:transparent;padding:0;text-align:left;position:relative}
.vopt .photo{aspect-ratio:1;outline:0 solid var(--son)}
.vopt.on .photo{outline-width:3px}
.vopt .n{text-wrap:balance;display:block;margin-top:9px;font-family:var(--serif);font-weight:600;font-size:14px;line-height:1.3;letter-spacing:.02em}
html[lang=vi] .vopt .n{font-size:18px;line-height:1.12;letter-spacing:0}
.vopt .s{display:block;font-size:10.5px;color:var(--sub);margin-top:2px}
.vopt .stamp{position:absolute;top:10px;right:10px;width:46px;height:46px;border-radius:50%;font-size:26px;padding-bottom:2px;transform:rotate(-8deg);display:none;box-shadow:0 0 0 2px var(--diep)}
.vopt.on .stamp{display:grid;animation:stamp .28s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.7);opacity:0}to{transform:rotate(-8deg) scale(1);opacity:1}}
.vsubmit{margin:22px 18px 0;width:calc(100% - 36px)}
.result{margin:0 18px;padding:20px 18px;background:var(--slip);border:1px solid var(--ink)}
.result h2{margin:0 0 6px;font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.04em}
html[lang=vi] .result h2{font-size:26px;letter-spacing:0}
.bar{margin-top:16px}
.bar .l{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;margin-bottom:6px}
.bar .l .num{font-size:18px}
.bar .tr{height:8px;background:#DDD3BB}
.bar .fi{height:100%;background:var(--olive);transition:width .6s}
.bar.mine .fi{background:var(--son)}
.vnote{margin:16px 20px 0;font-size:10px;line-height:1.7;color:var(--muted)}

/* bottom nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--slip);border-top:1px solid var(--ink);padding:4px 6px 10px}
.nav button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;justify-content:center;font-size:10px;color:var(--muted);position:relative}
.nav button.on{color:var(--ink);font-weight:600}
.nav button.on::before{content:"";position:absolute;top:1px;width:6px;height:6px;border-radius:50%;background:var(--son)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:var(--diep);font-size:12px;padding:11px 16px;border-radius:2px;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <header class="top" id="top">
    <button class="brand" data-go="home" aria-label="Cộng Tokyo, trang chủ">
      <b>CỘNG</b><span class="hanko" aria-hidden="true">東京</span>
    </button>
    <div class="top-actions">
      <div class="lang" role="group" aria-label="言語 / Ngôn ngữ">
        <button id="l-ja" data-lang="ja">日本語</button>
        <button id="l-vi" data-lang="vi">VI</button>
      </div>
      <button class="icon-btn" data-go="cart" aria-label="カート / Giỏ hàng">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#25221C" stroke-width="1.5" stroke-linejoin="round"><path d="M5.5 8.5h13l1 11h-15z M9 9V6a3 3 0 0 1 6 0v3"/></svg>
        <span class="badge" id="badge" hidden>0</span>
      </button>
    </div>
  </header>
  <main id="app"></main>
  <nav class="nav" aria-label="ナビゲーション">
    <button data-go="home" data-nav="home"><svg viewBox="0 0 24 24"><path d="M3.5 10 12 3l8.5 7v10h-17z M9.5 20v-6h5v6"/></svg><span data-t="nav-home"></span></button>
    <button data-go="menu" data-nav="menu"><svg viewBox="0 0 24 24"><path d="M5 11h12v5a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5z M17 12.5h1.5a2.5 2.5 0 0 1 0 5H17 M9 3.5c-.8 1.5.8 2.5 0 4 M13 3.5c-.8 1.5.8 2.5 0 4"/></svg><span data-t="nav-menu"></span></button>
    <button data-go="vote" data-nav="vote"><svg viewBox="0 0 24 24"><path d="M12 20s-8-4.7-8-10.3A4.4 4.4 0 0 1 12 7a4.4 4.4 0 0 1 8 2.7C20 15.3 12 20 12 20z"/></svg><span data-t="nav-vote"></span></button>
    <button data-go="cart" data-nav="cart"><svg viewBox="0 0 24 24"><path d="M5.5 8.5h13l1 11h-15z M9 9V6a3 3 0 0 1 6 0v3"/></svg><span data-t="nav-cart"></span></button>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script>
(function(){
"use strict";
/* ===== Cấu hình bình chọn chung (tùy chọn) =====
   Dán URL Google Apps Script (/exec) vào đây khi đưa web lên Netlify / GitHub Pages

function vMenu(){
  var rows=CATS.map(function(c){var n=P.filter(function(p){return p.cat===c.id;}).length;
    return '<button class="cat" data-go="c-'+c.id+'"><svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#25221C" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+c.icon+'</svg><span class="t"><b>'+L(c.ja,c.vi)+'</b><small>'+L2(c.ja,c.vi)+'</small></span><span class="cnt num">'+n+'</span>'+chev+'</button>';}).join("");
  return '<div class="ptitle"><h1>'+L("お品書き","Thực đơn")+'</h1><p>'+L2("お品書き","Thực đơn")+'</p></div><div class="cats">'+rows+'</div><div class="tiles" aria-hidden="true"></div>';
}
function vCat(cid){
  var c=CATS.filter(function(x){return x.id===cid;})[0]; if(!c) return vMenu();
  var rows=P.filter(function(p){return p.cat===cid;}).map(row).join("");
  return '<button class="back" data-go="menu">'+back()+L("メニューに戻る","Quay lại thực đơn")+'</button><div class="ptitle" style="padding-top:6px"><h1>'+L(c.ja,c.vi)+'</h1><p>'+L2(c.ja,c.vi)+'</p></div><div class="plist">'+rows+'</div>'+
  '<p class="vnote">'+L("価格はすべて税込です（参考価格）","Giá đã gồm thuế, mang tính minh họa")+'</p>';
}
function back(){ return '<svg width="9" height="15" viewBox="0 0 10 16" aria-hidden="true"><path d="M8 2L2 8l6 6" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>'; }
function row(p){
  return '<button class="prow" data-go="p-'+p.id+'"><img src="'+IMG[p.img]+'" alt="'+p.vi+'" loading="lazy"><span class="t">'+(p.tag?'<span class="tag">'+p.tag+'</span>':'')+'<span class="n">'+L(p.ja,p.vi)+'</span><span class="s">'+L2(p.ja,p.vi)+'</span></span><span class="p num">'+yen(p.price)+'</span>'+chev+'</button>';
}
function vProduct(id){
  var p=byId[id]; if(!p) return vMenu();
  if(S.cur!==id){ S.cur=id; S.sweet=50; S.qty=1; }
  var sw=SWEET.map(function(s){return '<button data-sweet="'+s.v+'" class="'+(S.sweet===s.v?'on':'')+'" aria-pressed="'+(S.sweet===s.v)+'"><b class="num">'+s.v+'%</b><small>'+L(s.ja,s.vi)+'</small></button>';}).join("");
  return '<button class="back" data-go="c-'+p.cat+'">'+back()+L("戻る","Quay lại")+'</button><div class="dimg photo"><img src="'+IMG[p.img]+'" alt="'+p.vi+'">'+(p.tag?'<span class="slip">'+p.tag+'</span>':'')+'</div>'+
  '<div class="dbody"><h1>'+L(p.ja,p.vi)+'</h1><div class="s">'+L2(p.ja,p.vi)+'</div>'+
  '<div class="price num">'+yen(p.price)+'</div><div class="tax">'+L("税込・参考価格","Đã gồm thuế, giá minh họa")+'</div>'+
  '<p class="desc">'+L(p.jaD,p.viD)+'</p>'+
  '<div class="label"><b>'+L("甘さを選ぶ","Chọn độ ngọt")+'</b><small>'+L2("甘さを選ぶ","Chọn độ ngọt")+'</small></div><div class="sweet">'+sw+'</div>'+
  '<div class="buy"><div class="stepper" role="group" aria-label="数量"><button data-qty="-1" aria-label="減らす">−</button><span class="num">'+S.qty+'</span><button data-qty="1" aria-label="増やす">+</button></div>'+
  btn("カートに追加","Thêm vào giỏ",'data-act="add"')+'</div>'+
  '<p class="note">'+L("注文体験のデモです。実際の注文・決済は行われません。","Trải nghiệm đặt món mô phỏng, không thanh toán hay gửi đơn thật.")+'</p></div>';
}
function vCart(){
  var items=S.cart.filter(function(i){return byId[i.id];});
  var head='<div class="ptitle"><h1>'+L("カート","Giỏ hàng")+'</h1><p>'+L2("カート","Giỏ hàng")+'</p></div>';
  if(!items.length) return head+'<div class="empty">'+L("カートは空です。<br>お気に入りの一杯を探してみましょう。","Giỏ hàng đang trống.<br>Hãy chọn một ly cà phê bạn thích.")+'</div><div style="padding:0 18px">'+cta("メニューを見る","Xem thực đơn","menu")+'</div>';
  var total=0;
  var list=items.map(function(i,ix){var p=byId[i.id]; total+=p.price*i.qty;
    return '<div class="citem"><img src="'+IMG[p.img]+'" alt="'+p.vi+'"><div class="t"><b>'+L(p.ja,p.vi)+'</b><small>'+L2(p.ja,p.vi)+'、'+L("甘さ","ngọt")+' '+i.sweet+'%</small>'+
    '<div class="row"><span class="num">'+yen(p.price*i.qty)+'</span><div class="stepper"><button data-cq="'+ix+'" data-d="-1" aria-label="減らす">−</button><span class="num">'+i.qty+'</span><button data-cq="'+ix+'" data-d="1" aria-label="増やす">+</button></div></div>'+
    '<button class="rm" data-rm="'+ix+'">'+L("削除","Xóa")+'</button></div></div>';}).join("");
  return head+'<div class="clist">'+list+'</div><div class="summary"><div class="r"><span>'+L("点数","Số lượng")+'</span><span>'+count()+'</span></div><div class="r total"><span>'+L("合計（税込）","Tổng cộng")+'</span><span class="num">'+yen(total)+'</span></div></div>'+
  '<div style="padding:18px 18px 0">'+btn("注文を体験する","Hoàn tất đặt thử",'data-act="checkout"')+
  '<p class="note">'+L("学習用デモです。お支払いは発生しません。","Chức năng minh họa, không phát sinh thanh toán.")+'</p></div>';
}
function vVote(){
  var head='<div class="ptitle"><h1 class="long">'+L("東京で飲んでみたい一杯は？","Bạn muốn thử món nào?")+'</h1><p>'+L2("東京で飲んでみたい一杯は？","Bạn muốn thử món nào?")+'</p></div>';
  if(!S.voted){
    var g=VOTE_IDS.map(function(id){var p=byId[id];var on=S.pick===id;
      return '<button class="vopt '+(on?'on':'')+'" data-pick="'+id+'" aria-pressed="'+on+'">'+photo(p)+'<span class="stamp hanko" aria-hidden="true">選</span><span class="n">'+L(p.ja,p.vi)+'</span><span class="s">'+L2(p.ja,p.vi)+'</span></button>';}).join("");
    return head+'<div class="vgrid">'+g+'</div>'+btn("投票する","Gửi bình chọn",'data-act="vote" '+(S.pick?'':'disabled'),'vsubmit')+vnote();
  }
  var res=S.remote||S.votes, tot=0; VOTE_IDS.forEach(function(id){tot+=Number(res[id])||0;});
  var bars=VOTE_IDS.map(function(id){var p=byId[id],n=Number(res[id])||0,pc=tot?Math.round(n*100/tot):0;
    return '<div class="bar '+(S.voted===id?'mine':'')+'"><div class="l"><span>'+L(p.ja,p.vi)+'</span><b class="num">'+pc+'%</b></div><div class="tr"><div class="fi" style="width:'+pc+'%"></div></div></div>';}).join("");
  return head+'<div class="result"><h2>'+L("ご投票ありがとうございます","Cảm ơn bạn đã bình chọn!")+'</h2><p style="margin:0;font-size:12px;color:var(--sub)">'+L("あなたの一杯：","Lựa chọn của bạn: ")+'<b>'+L(byId[S.voted].ja,byId[S.voted].vi)+'</b></p>'+bars+
  '<p style="margin:16px 0 0;font-size:11px;color:var(--muted)">'+L("合計 "+tot+" 票","Tổng "+tot+" lượt")+(VOTE_API_URL?'':L("（この端末）"," (trên thiết bị này)"))+'</p></div>'+vnote();
}
function vnote(){ return '<p class="vnote">'+L("授業内の体験アンケートです。日本の消費者全体を代表するものではありません。","Khảo sát trải nghiệm trong lớp, không đại diện cho người tiêu dùng Nhật Bản.")+'</p>'; }

/* ===== Router (#home, #menu, #c-coffee, #p-coconut, #vote, #cart) ===== */
function route(){ var h=(location.hash||"").replace("#",""); return /^[a-z0-9-]+$/.test(h)?h:"home"; }
var app=document.getElementById("app"), shown=null;
function render(){
  var r=route(), html;
  if(r==="menu") html=vMenu();
  else if(r.indexOf("c-")===0) html=vCat(r.slice(2));
  else if(r.indexOf("p-")===0) html=vProduct(r.slice(2));
  else if(r==="cart") html=vCart();
  else if(r==="vote") html=vVote();
  else html=vHome();
  /* the curtain sways only when a page is first entered, not on every tap */
  app.innerHTML='<div class="'+(shown===r?'':'enter')+'">'+html+'</div>'; shown=r;
  document.documentElement.lang=S.lang;
  document.getElementById("l-ja").classList.toggle("on",S.lang==="ja");
  document.getElementById("l-vi").classList.toggle("on",S.lang==="vi");
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"),function(el){var t=T[el.getAttribute("data-t")];el.textContent=L(t[0],t[1]);});
  var sec=r==="cart"?"cart":r==="vote"?"vote":(r==="menu"||r.indexOf("c-")===0||r.indexOf("p-")===0)?"menu":"home";
  Array.prototype.forEach.call(document.querySelectorAll("[data-nav]"),function(el){el.classList.toggle("on",el.getAttribute("data-nav")===sec);});
  var b=document.getElementById("badge"), c=count(); b.textContent=c; b.hidden=!c;
}
function go(where){ if(route()===where){render();} else { location.hash=where; } window.scrollTo(0,0); }
var tt; function toast(m){ var el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){el.classList.remove("show");},2400); }

/* ===== Vote sync (Google Apps Script, dùng khi host ngoài) ===== */
function loadRemote(){
  if(!VOTE_API_URL) return;
  var cb="ctcb"+Math.floor(Math.random()*1e9), s=document.createElement("script");
  window[cb]=function(d){ if(d&&d.counts){S.remote=d.counts; if(route()==="vote") render();} delete window[cb]; s.remove(); };
  s.src=VOTE_API_URL+"?action=results&callback="+cb; s.onerror=function(){ s.remove(); };
  document.head.appendChild(s);
}
function sendVote(id){
  if(!VOTE_API_URL) return;
  try{ fetch(VOTE_API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({drinkId:id})}).then(function(){setTimeout(loadRemote,700);}).catch(function(){}); }catch(e){}
}

document.addEventListener("click",function(e){
  var t=e.target.closest("button"); if(!t) return;
  var d=t.dataset;
  if(d.lang){ S.lang=d.lang; save("ct_lang",S.lang); render(); return; }
  if(d.go){ go(d.go); return; }
  if(d.sweet){ S.sweet=Number(d.sweet); render(); return; }
  if(d.qty){ S.qty=Math.min(20,Math.max(1,S.qty+Number(d.qty))); render(); return; }
  if(d.cq){ var i=S.cart[Number(d.cq)]; if(i){ i.qty+=Number(d.d); if(i.qty<=0) S.cart.splice(Number(d.cq),1); save("ct_cart",S.cart); render(); } return; }
  if(d.rm){ S.cart.splice(Number(d.rm),1); save("ct_cart",S.cart); render(); return; }
  if(d.pick){ S.pick=d.pick; render(); return; }
  if(d.act==="add"){ var f=S.cart.filter(function(x){return x.id===S.cur&&x.sweet===S.sweet;})[0];
    if(f) f.qty+=S.qty; else S.cart.push({id:S.cur,qty:S.qty,sweet:S.sweet});
    save("ct_cart",S.cart); render(); toast(L("カートに追加しました","Đã thêm vào giỏ hàng")); return; }
  if(d.act==="checkout"){ S.cart=[]; save("ct_cart",S.cart); render(); toast(L("注文体験が完了しました","Đặt thử thành công!")); return; }
  if(d.act==="vote" && S.pick && !S.voted){ S.voted=S.pick; S.votes[S.pick]=(Number(S.votes[S.pick])||0)+1; save("ct_voted",S.voted); save("ct_votes",S.votes); sendVote(S.pick); render(); return; }
});
window.addEventListener("hashchange",function(){ render(); window.scrollTo(0,0); });
window.addEventListener("scroll",function(){ document.getElementById("top").classList.toggle("scrolled",window.scrollY>8); },{passive:true});
render(); loadRemote();
})();
</script>
